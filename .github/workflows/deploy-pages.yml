name: Deploy web app to GitHub Pages

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      # On a release tag, embed that version in the Web package metadata.
      # Branch builds continue using pubspec.yaml, so no tag lookup is needed.
      # The tag event rebuilds Pages after the APK release tag is pushed.
      - name: Build web
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            flutter build web --release \
              --build-name "${GITHUB_REF_NAME#v}" \
              --dart-define=ASSET_REVISION=${{ github.sha }} \
              --base-href "/${{ github.event.repository.name }}/"
          else
            flutter build web --release \
              --dart-define=ASSET_REVISION=${{ github.sha }} \
              --base-href "/${{ github.event.repository.name }}/"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
