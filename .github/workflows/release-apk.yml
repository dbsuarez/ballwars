name: Release Android APK

# Push a version tag to publish a release, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      # Recreate the signing key from repository secrets. Every release must be
      # signed with the same key, or phones refuse to install it as an update.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret; refusing to publish a debug-signed APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=../upload-keystore.jks"
          } > android/key.properties

      # The tag is the source of truth for versionName AND versionCode.
      # Numeric format M*1000000 + m*1000 + p is monotonic for 0..999
      # minor/patch values and avoids workflow-run-number resets/downgrades.
      - name: Build APK
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable vMAJOR.MINOR.PATCH release tag"
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          if (( MINOR > 999 || PATCH > 999 )); then
            echo "::error::Minor and patch components must be below 1000"
            exit 1
          fi
          BUILD_NUMBER=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          if (( BUILD_NUMBER <= 0 || BUILD_NUMBER > 2100000000 )); then
            echo "::error::Android versionCode outside supported range"
            exit 1
          fi
          flutter build apk --release --dart-define=ASSET_REVISION=${{ github.sha }} \
            --build-name "$VERSION" \
            --build-number "$BUILD_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk "ballwars-${GITHUB_REF_NAME}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "ballwars-${GITHUB_REF_NAME}.apk" \
            --title "Ball Wars $GITHUB_REF_NAME" \
            --generate-notes
